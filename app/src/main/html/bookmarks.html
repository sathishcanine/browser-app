<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta content="en-us" http-equiv="Content-Language"/>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>${TITLE}</title>
</head>
<style>
    :root {
        --body-bg: {COLOR}
        --box-bg: {COLOR}
        --box-txt: {COLOR}
        --search-bar-bg: {COLOR}
    }

    body {
        background: var(--body-bg);
        padding-top: 5px;
        max-width: 100%;
        min-height: 100%;
        margin: 0;
    }

    /* Google-style search block (above bookmarks) */
    .google-search-wrap {
        max-width: 584px;
        margin: 8px auto 20px;
        padding: 0 16px;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
    }

    #content {
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        padding-top: 0;
        text-align: center;
    }

    .box {
        vertical-align: middle;
        text-align: center;
        position: relative;
        display: inline-block;
        height: 45px;
        width: 145px;
        margin: 6px;
        padding: 4px;
        background-color: var(--box-bg);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--box-txt);
        -moz-border-radius: 8px;
        -webkit-border-radius: 8px;
        border-radius: 8px;
    }

    .box-content {
        height: 25px;
        width: 100%;
        vertical-align: middle;
        text-align: center;
        display: table-cell;
    }

    p.ellipses {
        width: 130px;
        font-size: small;
        font-family: Arial, Helvetica, sans-serif;
        white-space: nowrap;
        overflow: hidden;
        text-align: left;
        vertical-align: middle;
        margin: auto;
        text-overflow: ellipsis;
        -o-text-overflow: ellipsis;
        -ms-text-overflow: ellipsis;
    }

    .box a {
        width: 100%;
        height: 100%;
        position: absolute;
        left: 0;
        top: 0;
    }

    img {
        vertical-align: middle;
        margin-right: 10px;
        width: 20px;
        height: 20px;
    }

    .margin {
        margin: 10px;
    }

    .box.add-shortcut {
        cursor: pointer;
        border: 1px dashed rgba(128, 128, 128, 0.45);
        background-color: transparent;
        -webkit-tap-highlight-color: transparent;
    }

    .box.add-shortcut:active {
        background-color: var(--box-bg);
    }

    .add-shortcut-inner {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        width: 130px;
    }

    .add-shortcut-plus {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        font-size: 20px;
        line-height: 1;
        font-weight: 300;
        opacity: 0.75;
        flex-shrink: 0;
    }

    .add-shortcut-label {
        opacity: 0.85;
    }

    .google-logo {
        font-size: 48px;
        font-weight: 400;
        letter-spacing: -2px;
        line-height: 1.1;
        margin-bottom: 20px;
        user-select: none;
    }

    .google-logo .c1 { color: #4285F4; }
    .google-logo .c2 { color: #EA4335; }
    .google-logo .c3 { color: #FBBC05; }
    .google-logo .c4 { color: #4285F4; }
    .google-logo .c5 { color: #34A853; }
    .google-logo .c6 { color: #EA4335; }

    .g-search-form {
        margin: 0;
    }

    .g-search-bar {
        display: flex;
        flex-direction: row;
        align-items: center;
        width: 100%;
        min-height: 44px;
        padding: 6px 10px 6px 14px;
        box-sizing: border-box;
        background-color: var(--search-bar-bg);
        border-radius: 9999px;
        border: 1px solid rgba(0, 0, 0, 0.06);
        box-shadow: 0 1px 6px rgba(32, 33, 36, 0.08);
    }

    .g-search-bar img.g-inline-logo {
        width: auto;
        height: 20px;
        max-width: 72px;
        object-fit: contain;
        object-position: center;
        margin: 0 10px 0 0;
        flex-shrink: 0;
    }

    .g-search-bar input {
        flex: 1 1 auto;
        min-width: 0;
        border: none;
        outline: none;
        background: transparent;
        font-size: 16px;
        color: var(--box-txt);
        font-family: Arial, Helvetica, sans-serif;
    }

    .g-search-bar input::placeholder {
        color: var(--box-txt);
        opacity: 0.55;
    }

    .g-search-actions {
        display: flex;
        flex-direction: row;
        align-items: center;
        flex-shrink: 0;
        gap: 4px;
        padding-left: 4px;
    }

    .g-search-actions button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border: none;
        background: transparent;
        border-radius: 50%;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }

    .g-search-actions button:active {
        background: rgba(0, 0, 0, 0.06);
    }

    .g-search-actions svg {
        display: block;
    }

    /* --------------------------------------------------------------------- */
    /* Discover (news) feed                                                   */
    /* --------------------------------------------------------------------- */
    .discover {
        max-width: 720px;
        margin: 24px auto 8px;
        padding: 0 12px 32px;
        text-align: left;
        font-family: -apple-system, "Roboto", "Segoe UI", system-ui, sans-serif;
        color: var(--box-txt);
    }
    .discover-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 4px 12px;
        border-bottom: 1px solid rgba(128,128,128,0.18);
        margin-bottom: 12px;
    }
    .discover-header .title {
        flex: 1 1 auto;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
    }
    .discover-header .updated {
        font-size: 11px;
        opacity: 0.6;
        margin-right: 6px;
    }
    .discover-subtitle {
        font-size: 12px;
        opacity: 0.7;
        margin: -4px 4px 12px;
        line-height: 1.35;
    }
    .discover-header button {
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        border: 0;
        padding: 6px;
        margin: 0;
        border-radius: 999px;
        color: inherit;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-tap-highlight-color: transparent;
    }
    .discover-header button:active { background: rgba(0,0,0,0.06); }
    .discover-header button svg { width: 18px; height: 18px; }
    .discover-header button.spinning svg {
        animation: discover-spin 1s linear infinite;
    }
    @keyframes discover-spin { to { transform: rotate(360deg); } }

    .discover-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .news-card {
        display: flex;
        flex-direction: row;
        align-items: stretch;
        min-height: 88px;
        background: var(--box-bg);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 1px 6px rgba(0,0,0,0.04);
        text-decoration: none;
        color: inherit;
        -webkit-tap-highlight-color: transparent;
    }
    .news-card:active { transform: scale(0.995); }
    .news-card .body {
        flex: 1 1 auto;
        min-width: 0;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 4px;
    }
    .news-card .headline {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.32;
        letter-spacing: -0.005em;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .news-card .meta {
        font-size: 11px;
        opacity: 0.6;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
    }
    .news-card .meta .dot { opacity: 0.5; }
    .news-card .meta .lang {
        padding: 1px 6px;
        border-radius: 999px;
        background: rgba(128,128,128,0.18);
        font-size: 10px;
        letter-spacing: 0.04em;
    }
    .news-card .thumb {
        flex: 0 0 104px;
        width: 104px;
        align-self: stretch;
        min-height: 88px;
        background-color: rgba(128,128,128,0.12);
        position: relative;
        overflow: hidden;
    }
    .news-card .thumb-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    /* Letterboxed favicon fallback (Google News items often have no RSS thumbnail). */
    .news-card .thumb.thumb-favicon {
        background-color: rgba(128,128,128,0.08);
    }
    .news-card .thumb.thumb-favicon .thumb-img {
        object-fit: contain;
        padding: 14px;
        box-sizing: border-box;
    }

    .discover-empty,
    .discover-loading {
        text-align: center;
        padding: 20px 12px;
        font-size: 13px;
        opacity: 0.65;
    }
</style>

<body>
<div class="google-search-wrap">
    <div class="google-logo" aria-hidden="true">
        <span class="c1">G</span><span class="c2">o</span><span class="c3">o</span><span class="c4">g</span><span class="c5">l</span><span class="c6">e</span>
    </div>
    <form class="g-search-form" onsubmit="return lightningBookmarkSearch(event)" autocomplete="off">
        <div class="g-search-bar">
            <img class="g-inline-logo" id="bookmark_search_engine_icon" src="file:///android_asset/google.png" alt=""/>
            <input type="text" id="bookmark_search_input" name="q"
                   placeholder="Search Google or type URL"
                   enterkeyhint="search"/>
            <div class="g-search-actions">
                <button type="submit" title="Search" aria-label="Search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                        <path fill="#5f6368"
                              d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                </button>
            </div>
        </div>
    </form>
</div>

<div id="content">

    <div id="repeated" class="box">
        <a href="${URL}"></a>
        <div class="margin">
            <div class="box-content">
                <p class="ellipses" id="title">
                    <img src="${IMAGE}" alt=""/>
                </p>
            </div>
        </div>
    </div>

</div>

<section class="discover" id="discover" hidden>
    <div class="discover-header">
        <span class="title" id="discover_title">Discover</span>
        <span class="updated" id="discover_updated"></span>
        <button id="discover_refresh" type="button" aria-label="Refresh news" title="Refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
        </button>
    </div>
    <div class="discover-subtitle" id="discover_subtitle"></div>
    <div class="discover-list" id="discover_list"></div>
    <div class="discover-loading" id="discover_loading" hidden>Loading news…</div>
    <div class="discover-empty" id="discover_empty" hidden>
        No news yet. Pull down to refresh.
    </div>
</section>

<script type="text/javascript">
        function lightningAddShortcut() {
            if (typeof MinnalHome !== "undefined" && MinnalHome.isAvailable()) {
                try { MinnalHome.addShortcut(); } catch (_) {}
            }
            return false;
        }

        function lightningBookmarkSearch(ev) {
            var el = document.getElementById("bookmark_search_input");
            var q = el && el.value ? el.value.trim() : "";
            if (!q) {
                return false;
            }
            var urlPattern = /^(https?:)?\/\//i;
            var domainLike = /^[\w.-]+\.[a-z]{2,}([\/?#][^\s]*)?$/i;
            if (urlPattern.test(q) || domainLike.test(q)) {
                var url = q;
                if (!/^https?:\/\//i.test(url)) {
                    url = "https://" + url;
                }
                window.location.href = url;
            } else {
                window.location.href = "${BASE_URL}" + encodeURIComponent(q);
            }
            el.value = "";
            return false;
        }

        // ---------------------------------------------------------------
        // Discover feed (RSS aggregated by NewsRepository, surfaced via
        // window.MinnalNews — see com.browser.minnal.news.NewsBridge).
        // ---------------------------------------------------------------
        (function() {
            var BRIDGE = (typeof MinnalNews !== "undefined") ? MinnalNews : null;
            if (!BRIDGE) return;
            // If isEnabled is missing (e.g. release shrink), do not abort the whole block — still try list().
            var discoverOn = true;
            try {
                if (typeof BRIDGE.isEnabled === "function") discoverOn = BRIDGE.isEnabled();
            } catch (_) { discoverOn = true; }
            if (!discoverOn) return;

            var section = document.getElementById("discover");
            var listEl = document.getElementById("discover_list");
            var refreshBtn = document.getElementById("discover_refresh");
            var loadingEl = document.getElementById("discover_loading");
            var emptyEl = document.getElementById("discover_empty");
            var updatedEl = document.getElementById("discover_updated");
            var subtitleEl = document.getElementById("discover_subtitle");
            if (!section || !listEl || !refreshBtn) return;

            section.hidden = false;
            var lastSignature = "";

            function escapeHtml(s) {
                if (s == null) return "";
                return String(s).replace(/[&<>"']/g, function(c) {
                    return ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" })[c];
                });
            }
            function relativeTime(ts) {
                if (!ts) return "";
                var diff = Date.now() - ts;
                if (diff < 60000) return "Just now";
                if (diff < 3600000) return Math.floor(diff / 60000) + "m ago";
                if (diff < 86400000) return Math.floor(diff / 3600000) + "h ago";
                return Math.floor(diff / 86400000) + "d ago";
            }
            function safeHostname(url) {
                try { return new URL(url).hostname.replace(/^www\./, ""); }
                catch (_) { return ""; }
            }
            function languageBadge(lang) {
                if (lang === "TAMIL") return "TA";
                return "EN";
            }
            function isFaviconThumb(url) {
                return url && url.indexOf("google.com/s2/favicons") !== -1;
            }

            function render(items) {
                if (!items.length) {
                    listEl.innerHTML = "";
                    emptyEl.hidden = false;
                    return;
                }
                emptyEl.hidden = true;
                listEl.innerHTML = items.map(function(item) {
                    var thumbClass = "thumb" + (isFaviconThumb(item.imageUrl) ? " thumb-favicon" : "");
                    var thumb = item.imageUrl
                        ? '<div class="' + thumbClass + '"><img class="thumb-img" src="' +
                            escapeHtml(item.imageUrl) + '" alt="" loading="lazy" decoding="async" ' +
                            'referrerpolicy="no-referrer" /></div>'
                        : '';
                    var lang = languageBadge(item.language);
                    var meta = '<div class="meta">' +
                        '<span class="lang">' + escapeHtml(lang) + '</span>' +
                        '<span>' + escapeHtml(item.sourceName || safeHostname(item.url)) + '</span>' +
                        '<span class="dot">·</span>' +
                        '<span>' + escapeHtml(relativeTime(item.publishedAt)) + '</span>' +
                        '</div>';
                    return '<a class="news-card" href="' + escapeHtml(item.url) + '">'
                         + '<div class="body">'
                         +   '<div class="headline">' + escapeHtml(item.title) + '</div>'
                         +   meta
                         + '</div>'
                         + thumb
                         + '</a>';
                }).join("");
            }

            function refreshFromBridge() {
                var json;
                try { json = BRIDGE.list(); } catch (_) { json = "[]"; }
                var items;
                try { items = JSON.parse(json || "[]"); } catch (_) { items = []; }
                if (!Array.isArray(items)) items = [];
                // Cheap diff: fingerprint URLs in order so we don't re-render every poll.
                var sig = items.length + ":" + items.slice(0, 8).map(function(i) { return i.url; }).join("|");
                if (sig !== lastSignature) {
                    render(items);
                    lastSignature = sig;
                }
                if (items.length === 0) loadingEl.hidden = false;
                else loadingEl.hidden = true;

                var state;
                try { state = JSON.parse(BRIDGE.state() || "{}"); } catch (_) { state = {}; }
                refreshBtn.classList.toggle("spinning", !!state.refreshing);
                if (state.updatedAt) {
                    updatedEl.textContent = "Updated " + relativeTime(state.updatedAt);
                } else {
                    updatedEl.textContent = "";
                }
                if (subtitleEl) {
                    if (Array.isArray(state.sources) && state.sources.length) {
                        var names = state.sources.map(function(s) { return s.name; });
                        subtitleEl.textContent = "From your bookmarks: " + names.join(" · ");
                    } else {
                        subtitleEl.textContent = "";
                    }
                }
            }

            refreshBtn.addEventListener("click", function() {
                try { BRIDGE.refresh(); } catch (_) {}
                refreshBtn.classList.add("spinning");
                setTimeout(refreshFromBridge, 300);
            });

            refreshFromBridge();
            // Light polling loop. Cheap because state()/list() are O(items).
            setInterval(refreshFromBridge, 1500);
        })();
</script>
</body>

</html>
